<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<title>Offline</title>
	<style>
		body {
			margin: 0;
			height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			background: #f0f2f5;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
		}

		.card {
			width: 420px;
			background: #fff;
			border-radius: 10px;
			box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
			padding: 30px;
			text-align: center;
		}

		.icon {
			font-size: 50px;
			margin-bottom: 10px;
		}

		h1 {
			font-size: 22px;
			margin: 10px 0;
		}

		p {
			color: #666;
			margin: 5px 0;
		}

		.status {
			margin-top: 15px;
			font-size: 14px;
			color: #999;
		}

		.steps {
			text-align: left;
			margin-top: 20px;
			font-size: 13px;
			color: #555;
		}

		.steps li {
			margin: 6px 0;
		}

		button {
			margin-top: 20px;
			padding: 10px 20px;
			border: none;
			background: #409eff;
			color: #fff;
			border-radius: 5px;
			cursor: pointer;
			font-size: 14px;
		}

		button:disabled {
			background: #aaa;
		}

		.loading {
			margin-top: 10px;
			font-size: 13px;
			color: #409eff;
		}
	</style>
</head>

<body>
	<div class="card">
		<div class="icon">📡</div>
		<h1 id="title">Network Error</h1>
		<p id="desc">Please check your connection</p>

		<div class="status" id="status">Checking network...</div>

		<ul class="steps" id="steps"></ul>

		<button id="retryBtn" onclick="retry()">Retry</button>
		<div class="loading" id="loading" style="display:none;">Reconnecting...</div>
	</div>

	<script>
		const lang = localStorage.getItem('lang') || 'en'

		const i18n = {
			zh: {
				title: '网络连接异常',
				desc: '无法连接到服务器，请检查网络',
				retry: '重试',
				checking: '正在检测网络状态...',
				reconnecting: '正在重新连接...',
				online: '网络已恢复，正在跳转...',
				steps: [
					'检查网线或 WiFi 是否连接',
					'检查网络是否被禁用',
					'尝试重新连接网络',
					'联系网络管理员'
				]
			},
			en: {
				title: 'Network Error',
				desc: 'Unable to connect to server',
				retry: 'Retry',
				checking: 'Checking network status...',
				reconnecting: 'Reconnecting...',
				online: 'Network restored, redirecting...',
				steps: [
					'Check your WiFi or cable',
					'Ensure network is enabled',
					'Reconnect to the network',
					'Contact administrator'
				]
			},
			ja: {
				title: 'ネットワークエラー',
				desc: 'サーバーに接続できません',
				retry: '再試行',
				checking: 'ネットワーク状態を確認中...',
				reconnecting: '再接続中...',
				online: '接続が回復しました。移動中...',
				steps: [
					'WiFiまたはケーブルを確認',
					'ネットワークが有効か確認',
					'再接続を試す',
					'管理者に連絡'
				]
			},
			ko: {
				title: '네트워크 오류',
				desc: '서버에 연결할 수 없습니다',
				retry: '다시 시도',
				checking: '네트워크 상태 확인 중...',
				reconnecting: '재연결 중...',
				online: '네트워크 복구됨, 이동 중...',
				steps: [
					'WiFi 또는 케이블 확인',
					'네트워크 활성화 여부 확인',
					'다시 연결 시도',
					'관리자 문의'
				]
			}
		}

		const t = i18n[lang] || i18n.en

		// 文本赋值
		document.getElementById('title').innerText = t.title
		document.getElementById('desc').innerText = t.desc
		document.getElementById('retryBtn').innerText = t.retry
		document.getElementById('status').innerText = t.checking

		const stepsEl = document.getElementById('steps')
		t.steps.forEach(s => {
			const li = document.createElement('li')
			li.innerText = '• ' + s
			stepsEl.appendChild(li)
		})

		function retry() {
			document.getElementById('loading').style.display = 'block'
			document.getElementById('status').innerText = t.reconnecting
			location.reload()
		}

		// 自动检测网络恢复
		function checkOnline() {
			if (navigator.onLine) {
				document.getElementById('status').innerText = t.online
				setTimeout(() => {
					location.href = '/'
				}, 1000)
			}
		}

		// 定时检测
		setInterval(checkOnline, 2000)

		window.addEventListener('online', checkOnline)
	</script>
</body>

</html>
